[project]
name = "setlab"
version = "0.1.0"
description = "Generador de sets para DJ a partir de playlists de Spotify y una biblioteca local"
readme = "AGENTS.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "typer>=0.12",
]

[project.scripts]
setlab = "setlab.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/setlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
